<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Usuários - ERP Cozinha Piloto</title>
    <!-- Importação das folhas de estilo unificadas do ecossistema -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/operacoes.css">
</head>
<body>

    <!-- Sidebar Translúcida macOS Injetada via JS -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Conteúdo Principal à direita do menu fixo -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Controle de Credenciais & Operadores</h1>
                <p>Gerencie as permissões de acesso por CPF de administradores, equipe administrativa e almoxarifes da Cozinha Piloto.</p>
            </div>
        </header>

        <!-- ================= PAINEL DE CADASTRO DE NOVO OPERADOR ================= -->
        <div class="painel-operacional">
            <div class="painel-titulo">👤 Credenciamento de Colaborador Municipal</div>
            <form id="form-cadastro-usuario" onsubmit="processarCadastroDeUsuario(event)">
                <div class="grid-formulario" style="align-items: flex-end;">
                    
                    <div class="campo-grupo">
                        <label for="usr-nome">Nome Completo</label>
                        <input type="text" id="usr-nome" required placeholder="Ex: Maria Silva (Nutri)">
                    </div>

                    <div class="campo-grupo">
                        <label for="usr-cpf">CPF do Servidor</label>
                        <input type="text" id="usr-cpf" required placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascaraCpfUsuario(this)">
                    </div>

                    <div class="campo-grupo">
                        <label for="usr-perfil">Perfil de Acesso (Permissões)</label>
                        <select id="usr-perfil" required>
                            <option value="OPERADOR">OPERADOR (Almoxarife / Chão de Fábrica)</option>
                            <option value="ADMINISTRATIVO">ADMINISTRATIVO (Notas / Produtos / Compras)</option>
                            <option value="ADMINISTRADOR">ADMINISTRADOR (Nutricionista / Gestão Total)</option>
                        </select>
                    </div>

                    <div class="campo-grupo">
                        <label for="usr-senha">Senha de Acesso</label>
                        <input type="password" id="usr-senha" required placeholder="Senha numéricas ou texto">
                    </div>

                    <div class="campo-grupo">
                        <button type="submit" class="btn-apple" style="height: 38px; background-color: var(--azul-apple);">
                            Homologar Operador
                        </button>
                    </div>

                </div>
            </form>
        </div>
        <!-- ================= LISTAGEM DE USUÁRIOS ATIVOS E OPERACIONAIS ================= -->
        <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; margin-top: 30px;">Equipe de Operadores Credenciados</h2>
        <div class="tabela-container">
            <table class="tabela-mac">
                <thead>
                    <tr>
                        <th>Nome do Servidor</th>
                        <th>CPF / Registro</th>
                        <th>Perfil Operacional</th>
                        <th>Status no ERP</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-usuarios">
                    <!-- Injetado dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Scripts de Segurança e Lógica Dinâmica Cruzada -->
    <script src="js/autenticador-sessao.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
