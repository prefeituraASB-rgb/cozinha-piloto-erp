<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - ERP Cozinha Piloto</title>
    <!-- Importação do estilo global unificado que criamos -->
    <link rel="stylesheet" href="css/global.css">
    
    <style>
        /* Estilos Exclusivos da Interface de Autenticação */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #e5e5ea 0%, #f5f5f7 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            animation: surgirSuave 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--cinza-texto-principal);
            letter-spacing: -0.02em;
        }

        .login-card p {
            font-size: 0.82rem;
            color: var(--cinza-texto-secundario);
            margin-top: 4px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--cinza-texto-principal);
            padding-left: 2px;
        }

        .form-group input {
            width: 100%;
            height: 42px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .btn-bloqueio {
            width: 100%;
            height: 44px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        /* Animação Nativa Apple Style */
        @keyframes surgirSuave {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <h1>Cozinha Piloto</h1>
            <p>Águas de Santa Bárbara - SP</p>
            
            <!-- Formulário interceptado por JavaScript para validação na nuvem -->
            <form id="form-autenticacao" onsubmit="solicitarAcessoAoERP(event)">
                
                <div class="form-group">
                    <label for="login-cpf">CPF do Colaborador</label>
                    <input 
                        type="text" 
                        id="login-cpf" 
                        required 
                        autocomplete="username"
                        placeholder="000.000.000-00" 
                        maxlength="14"
                        oninput="aplicarMascaraDeCPF(this)"
                    >
                </div>
                
                <div class="form-group">
                    <label for="login-senha">Senha do Sistema</label>
                    <input 
                        type="password" 
                        id="login-senha" 
                        required 
                        autocomplete="current-password"
                        placeholder="••••••••"
                    >
                </div>
                
                <button type="submit" class="btn-apple btn-bloqueio">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- Scripts de Lógica de Controle Avançado -->
    <script src="js/login.js"></script>
</body>
</html>
